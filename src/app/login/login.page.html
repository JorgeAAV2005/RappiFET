<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start" class="back">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="content" [fullscreen]="true">
  <!-- Imagen de fondo -->

  <!-- Imagen adicional sobre el fondo -->
  <div class="image-container">
    <img src="assets/fondo.png" alt="LOGO" />
  </div>

  <!-- Contenedor del formulario de login -->
  <div class="login-form">
    <h1>Ingresa tus datos</h1>

    <div class="input-group">
      <label for="email">Usuario</label>
      <ion-item>
        <ion-input id="email" type="email" [(ngModel)]="usuario" name="email"></ion-input>
      </ion-item>
    </div>

    <div class="input-group">
      <label for="password">Contraseña</label>
      <ion-item>
        <ion-input id="password" type="password" [(ngModel)]="contrasena" name="password"></ion-input>
      </ion-item>
    </div>

    <ion-button expand="block" shape="round" class="login-button" (click)="login()">Ingresar</ion-button>
  </div>
</ion-content>
